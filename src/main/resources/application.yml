spring:
  application:
    name: mspace-core
  # 값은 .env(로컬은 compose.yaml 기본값)에서. 비밀번호를 여기 적지 않는다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mspace}
    username: ${DB_USERNAME:mspace}
    password: ${DB_PASSWORD:mspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul   # 7일·자정 계산이 서울 기준이 되게 (schema-v2.sql 끝 주석 0번)
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# 예약 규칙 숫자 (요구사항 FR-RSV-001: 설정값으로 둔다)
mspace:
  reservation:
    booking-window-days: 7   # 오늘 포함 7일 (오늘 ~ 오늘+6일)
    slot-minutes: 30
    max-minutes: 120         # 1회 최대 2시간
    lock-timeout: 3s         # 예약 저장 때 잠금(advisory lock) 최대 대기. 넘으면 다시 하고, 3번 다 넘으면 503
  auth:
    # 임시: 로그인이 붙기 전까지 X-User-Id 헤더로 회원을 받는다. 운영에서는 꼭 false
    dev-header: ${MSPACE_DEV_HEADER:false}
