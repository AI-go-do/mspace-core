spring:
  application:
    name: mspace-core
  # 값은 .env(로컬은 compose.yaml 기본값)에서. 비밀번호를 여기 적지 않는다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mspace}
    username: ${DB_USERNAME:mspace}
    password: ${DB_PASSWORD:mspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul   # 7일·자정 계산이 서울 기준이 되게 (schema-v2.sql 끝 주석 0번)
  flyway:
    locations: classpath:db/migration
  # 인증번호 메일 (팀 Gmail + 앱 비밀번호). MAIL_ENABLED=true일 때만 실제로 보낸다
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true        # TLS로 못 바꾸면 평문으로 보내지 않고 실패
      mail.smtp.ssl.checkserveridentity: true  # 인증서의 서버 이름 확인
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # Gmail이 잠깐 안 돼도 서버 전체를 DOWN으로 보지 않게 (메일은 로그인 일부일 뿐)

# 예약 규칙 숫자 (요구사항 FR-RSV-001: 설정값으로 둔다)
mspace:
  reservation:
    booking-window-days: 7   # 오늘 포함 7일 (오늘 ~ 오늘+6일)
    slot-minutes: 30
  auth:
    jwt:
      secret: ${JWT_SECRET:}   # 32바이트 이상. 비우면 실행할 때마다 임시값(로컬 전용)
      ttl: ${JWT_TTL:12h}      # 짧게 둬서 "중간에 못 끊는" JWT 약점을 줄인다
      issuer: mspace-core
  mail:
    enabled: ${MAIL_ENABLED:false}   # false면 인증번호를 로그에 찍는다
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
