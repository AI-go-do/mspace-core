spring:
  application:
    name: mspace-core
  # 값은 .env(로컬은 compose.yaml 기본값)에서. 비밀번호를 여기 적지 않는다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mspace}
    username: ${DB_USERNAME:mspace}
    password: ${DB_PASSWORD:mspace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul   # 7일·자정 계산이 서울 기준이 되게 (schema-v2.sql 끝 주석 0번)
  flyway:
    locations: classpath:db/migration
  # 인증번호 메일 (팀 Gmail + 앱 비밀번호). MAIL_ENABLED=true일 때만 실제로 보낸다
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true        # TLS로 못 바꾸면 평문으로 보내지 않고 실패
      mail.smtp.ssl.checkserveridentity: true  # 인증서의 서버 이름 확인
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # Gmail이 잠깐 안 돼도 서버 전체를 DOWN으로 보지 않게 (메일은 로그인 일부일 뿐)

# 예약 규칙 숫자 (요구사항 FR-RSV-001: 설정값으로 둔다)
mspace:
  reservation:
    booking-window-days: 7   # 오늘 포함 7일 (오늘 ~ 오늘+6일)
    slot-minutes: 30
    max-minutes: 120         # 1회 최대 2시간
    lock-timeout: 3s         # 예약 저장 때 잠금(advisory lock) 최대 대기. 넘으면 다시 하고, 3번 다 넘으면 503
    extension:               # 연장하기 (FR-RSV-105)
      max-count: 1           # 이어진 사용 한 번에 연장 1회
      open-before-minutes: 10  # 종료 10분 전부터 종료 전까지
      max-minutes: 120       # 한 번에 늘리는 시간은 원래 종료부터 30분 단위, 최대 2시간
      chain-gap-minutes: 30  # 직전 예약이 끝난 뒤 30분 안에 시작하면 이어진 사용으로 본다
    sweep:
      enabled: ${MSPACE_SWEEP_ENABLED:true}   # 노쇼·자동 퇴실 정리 (FR-RSV-101, 102)
      interval: PT1M         # 1분마다. 노쇼·자동 퇴실은 최대 이만큼 늦게 반영된다
  access:
    open-before-minutes: 10  # 번호는 시작 10분 전부터 끝나기 전까지 (FR-ACC-001)
    lock-after-failures: 5   # 5번 연속 틀리면
    lock-seconds: 60         # 그 방 키패드 1분 잠금
    # 키패드가 Authorization: Bearer 로 보내는 토큰. 비어 있으면 장치 요청을 모두 401로 막는다. 값은 .env에만
    device-token: ${MSPACE_DEVICE_TOKEN:}
  auth:
    # 임시: 로그인이 붙기 전까지 X-User-Id 헤더로 회원을 받는다. 운영에서는 꼭 false
    dev-header: ${MSPACE_DEV_HEADER:false}
    jwt:
      secret: ${JWT_SECRET:}   # 32바이트 이상. 비우면 실행할 때마다 임시값(로컬 전용)
      ttl: ${JWT_TTL:1h}       # 액세스 토큰. 짧게 둬서 "중간에 못 끊는" JWT 약점을 줄인다
      refresh-ttl: ${JWT_REFRESH_TTL:14d}   # 자동 로그인 기간. DB에 해시로 저장돼 로그아웃하면 바로 끊긴다
      issuer: mspace-core
  mail:
    enabled: ${MAIL_ENABLED:false}   # false면 인증번호를 로그에 찍는다
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
