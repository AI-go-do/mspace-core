# 테스트에서만 덧붙는 설정. Spring Boot는 classpath:/application.yml 위에 classpath:/config/application.yml을 겹쳐 읽는다
# (main 설정을 갈아끼우지 않고 이 값만 바꾼다).
mspace:
  reservation:
    # 친구 확인은 FriendApiTest가 켜고 본다. 다른 예약 테스트는 친구 맺기 없이 참여자 규칙만 본다
    friends-only: false
    sweep:
      # 1분 정리가 테스트 도중 끼어들어 예약 상태를 바꾸지 않게 끈다.
      # 정리는 테스트가 시계를 옮긴 뒤 SweepReservationsUseCase.sweep()을 직접 불러서 본다 (ReservationSweepTest)
      enabled: false
  notification:
    reminder:
      # 정리와 같은 이유로 끈다. 알림은 테스트가 SendRemindersUseCase.sendDue()를 직접 불러서 본다 (ReminderTest)
      enabled: false
