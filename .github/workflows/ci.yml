# PR마다 빌드·테스트를 돌려서, 깨진 코드가 develop/main에 합쳐지지 않게 막는다.
name: CI

on:
  pull_request:              # PR을 열거나 새 커밋을 올릴 때
    branches: [develop, main]
  push:                      # 합쳐진 뒤에도 develop/main이 여전히 초록인지 확인
    branches: [develop, main]

# 같은 PR에 커밋을 연달아 올리면 이전 실행은 취소하고 최신 것만 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 코드를 읽기만 한다 (최소 권한)
permissions:
  contents: read

jobs:
  build:                     # 브랜치 보호에서 "필수 검사"로 고를 이름
    name: build
    runs-on: ubuntu-latest   # Docker가 깔려 있어서 Testcontainers가 그대로 돈다
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # 단계의 if에서 읽으려면 job 단계에 둬야 한다
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # 팀 SonarQube 서버 주소 (스캐너가 이 환경변수를 읽는다)

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # SonarQube가 "새 코드"를 가리려면 커밋 기록 전체가 필요

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven       # ~/.m2를 캐시해서 두 번째부터 빨라진다

      - name: 빌드 + 테스트
        # -B: 로그를 CI용으로 간결하게 (JaCoCo 커버리지 보고서도 여기서 만든다)
        # main으로 가는 PR이면 coverage-gate를 켜서 줄 커버리지 80% 미만일 때 빌드를 실패시킨다
        run: ./mvnw -B verify ${{ github.base_ref == 'main' && '-Pcoverage-gate' || '' }}

      # 팀 SonarQube 서버에 결과(커버리지·코드 냄새)를 보낸다
      # SONAR_TOKEN 비밀값이 없으면(설정 전) 건너뛴다. 80% 품질 게이트는 main에 합칠 때만 건다
      - name: SonarQube 분석
        if: env.SONAR_TOKEN != ''
        # Sonar 서버·토큰 문제로 build 검사(develop 필수)가 빨개지지 않게. main 80% 게이트는 따로 건다
        continue-on-error: true
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
